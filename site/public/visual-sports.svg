<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2=".28" y2="1">
      <stop offset="0%" stop-color="#84ecd5" stop-opacity=".5"/>
      <stop offset="45%" stop-color="#62dfc3" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#030504" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cone2" x1="1" y1="0" x2=".72" y2="1">
      <stop offset="0%" stop-color="#84ecd5" stop-opacity=".32"/>
      <stop offset="50%" stop-color="#62dfc3" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#030504" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fieldglow" cx="60%" cy="112%" r="90%">
      <stop offset="0%" stop-color="#173f36" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#0d2b25" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#030504" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .38 0 0 0 0 .87 0 0 0 0 .76 0 0 0 .05 0"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#030504"/>
  <rect width="800" height="500" fill="url(#fieldglow)"/>
  <g filter="url(#soft2)">
    <polygon points="470,-20 420,-20 610,500 760,500" fill="url(#cone)"/>
    <polygon points="820,10 770,-30 560,500 700,500" fill="url(#cone2)"/>
  </g>
  <g stroke="#62dfc3" fill="none" opacity=".33">
    <path d="M 340 520 A 300 300 0 0 1 900 470" stroke-width="1.4"/>
    <path d="M 400 540 A 240 240 0 0 1 860 500" stroke-width="1" opacity=".6"/>
  </g>
  <circle cx="452" cy="-6" r="15" fill="#c9fff1" opacity=".8" filter="url(#soft2)"/>
  <circle cx="788" cy="-8" r="12" fill="#c9fff1" opacity=".6" filter="url(#soft2)"/>
  <rect width="800" height="500" filter="url(#grain2)" opacity=".5"/>
  <linearGradient id="fadeL2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#030504" stop-opacity="1"/>
    <stop offset="55%" stop-color="#030504" stop-opacity="0"/>
  </linearGradient>
  <rect width="800" height="500" fill="url(#fadeL2)"/>
</svg>
